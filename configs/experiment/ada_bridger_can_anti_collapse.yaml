# Ada-BRIDGER CAN anti-collapse config
# 目标：避免 scheduler 早期塌缩到 k=0，同时保证任务分数先起来

name: train_ada_bridger_can_anti_collapse
_target_: diffusion_policy.workspace.train_ada_bridger_workspace.TrainAdaBridgerWorkspace

obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
task_name: ${task.name}
exp_name: "ada_bridger"

# robomimic lowdim 常用序列参数
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0

# 预训练模型
source_policy_checkpoint: "weights/lowdim/predictor/vae/vae_can_lowdim/checkpoints/latest.ckpt"
source_policy_config: null
refinement_policy_checkpoint: "weights/lowdim/diffusion/robomimic/cnn/can/epoch=0350-test_mean_score=1.000.ckpt"
refinement_policy_config: null

scheduler:
  hidden_dim: 256
  num_layers: 2
  # 精炼步数直接对应 DDIM 推理步数 {0, 1, 2, 5}（4-way）
  refinement_steps: [0, 1, 2, 5]
  max_refinement_steps: 5
  # 关键：不要从零开始
  pretrain_checkpoint: "data/outputs/ada_scheduler_can/scheduler_best.pt"

# Stage 4 配置（lightweight_ppo 或 ppo_pegrad）
stage4:
  mode: lightweight_ppo
  reward:
    cost_type: refinement_steps
    cost_coef_target: 0.05
    task_only_epochs: 10
    cost_warmup_epochs: 20
  regularization:
    kl_to_pretrained: false
    kl_coef: 0.05
  guard:
    enable: false
    eval_every: 5
    success_tolerance: 0.05
    rollback_on_drop: true

pegrad:
  task_weight: 1.0
  cost_weight: 0.1
  project_cost_to_task: True
  clip_grad_norm: 0.5

ppo:
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  # 提高探索，防止早期策略塌缩到单一 k
  entropy_coef: 0.15
  max_grad_norm: 0.5
  # 第一阶段先弱化效率惩罚，让策略先学会做对任务
  efficiency_coef: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 4
  batch_size: 64

optimizer:
  lr: 3.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  num_epochs: 500
  # 提高 rollout 数量，降低 PPO 高方差导致的塌缩
  n_rollouts_per_epoch: 6
  eval_every: 10
  checkpoint_every: 50
  tqdm_interval_sec: 1.0

logging:
  project: ada_bridger_can
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test/mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test/mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
