# Ada-BRIDGER PushT — score-focused config
# 目标：最大化测试集成功率，不关心 latency

name: train_ada_bridger_pusht_score
_target_: diffusion_policy.workspace.train_ada_bridger_workspace.TrainAdaBridgerWorkspace

obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
task_name: ${task.name}
exp_name: "ada_bridger_score"

# PushT 常用序列参数
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0

# 预训练模型
source_policy_checkpoint: "weights/lowdim/predictor/vae/vae_pusht_lowdim/checkpoints/latest.ckpt"
source_policy_config: null
refinement_policy_checkpoint: "weights/lowdim/diffusion/pusht/cnn/latest.ckpt"
refinement_policy_config: null

scheduler:
  hidden_dim: 256
  num_layers: 2
  # Binary action space: 0=VAE, 5=full refine. 简化决策。
  refinement_steps: [0, 5]
  max_refinement_steps: 5

# Stage 4 配置
stage4:
  mode: lightweight_ppo
  reward:
    cost_type: refinement_steps
    cost_coef_target: 0.0   # 先完全不要 cost penalty
    task_only_epochs: 500    # 全程 task only
    cost_warmup_epochs: 0
  regularization:
    kl_to_pretrained: false
    kl_coef: 0.05
  guard:
    enable: true
    eval_every: 10
    success_tolerance: 0.03
    rollback_on_drop: true

pegrad:
  task_weight: 1.0
  cost_weight: 0.0
  project_cost_to_task: False
  clip_grad_norm: 0.5

ppo:
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.02      # 低熵，允许快速收敛
  max_grad_norm: 0.5
  efficiency_coef: 0.0    # 不要效率惩罚
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 8             # 更多 PPO epoch
  batch_size: 64

optimizer:
  lr: 3.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  num_epochs: 200         # 2-way 收敛更快
  n_rollouts_per_epoch: 6  # 更多样本，降低方差
  eval_every: 10
  checkpoint_every: 50
  tqdm_interval_sec: 1.0

logging:
  project: ada_bridger_pusht_score
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
