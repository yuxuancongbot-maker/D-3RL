name: train_action_predictor_image_vae
_target_: diffusion_policy.workspace.train_action_predictor_image_workspace.TrainActionPredictorImageWorkspace
encoder_output_dim: 128
action_dim: ${task.shape_meta.action.shape[0]}
keypoint_dim: 0
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: false
keypoint_visible_rate: 1.0
dataset_obs_steps: ${n_obs_steps}
prev_action_horizon: 8
policy:
  _target_: diffusion_policy.policy.action_predictor_image_vae_policy.ActionPredictorImageVAEPolicy
  encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${task.shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.small_conv_encoder.SmallConvEncoder
      in_channels: 3
      embed_dim: ${encoder_output_dim}
    resize_shape: null
    crop_shape: null
    random_crop: false
    use_group_norm: false
    share_rgb_model: true
    imagenet_norm: false
  model:
    _target_: diffusion_policy.model.action_predictor.vae_action_predictor.VAEModel
    action_dim: ${action_dim}
    action_horizon: ${horizon}
    obs_dim: ${encoder_output_dim}
    obs_horizon: ${n_obs_steps}
    latent_dim: 32
    layer: 256
    use_ema: true
    pretrain: false
    ckpt_path: null
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  temperature: 1.0
dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true
optimizer:
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.0001
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 1000
  gradient_accumulate_every: 1
  use_ema: false
  rollout_every: 50
  checkpoint_every: 50
  val_every: 10
  sample_every: 10
  freeze_encoder: false
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  project: action_predictor_image_vae
  resume: true
  mode: online
  name: ${name}_${task.name}
  tags:
  - ${name}
  - ${task.name}
  id: null
  group: null
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: val_loss
    mode: min
    k: 3
    format_str: epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt
