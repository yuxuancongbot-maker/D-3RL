# Ada-BRIDGER lift — 4-way {0,1,2,5} + K5-bias PPO (PushT SOTA method)
name: train_ada_bridger_lift_4way
_target_: diffusion_policy.workspace.train_ada_bridger_workspace.TrainAdaBridgerWorkspace

obs_dim: 19
action_dim: 10
task_name: ${task.name}
exp_name: "ada_bridger_lift_4way"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0

source_policy_checkpoint: "weights/lowdim/predictor/vae/vae_lift_lowdim/checkpoints/latest.ckpt"
source_policy_config: null
refinement_policy_checkpoint: "weights/lowdim/diffusion/robomimic/cnn/lift/epoch=0450-test_mean_score=1.000.ckpt"
refinement_policy_config: null

scheduler:
  hidden_dim: 256
  num_layers: 2
  refinement_steps: [0, 1, 2, 5]
  max_refinement_steps: 5

stage4:
  mode: lightweight_ppo
  reward:
    cost_type: refinement_steps
    cost_coef_target: 0.0
    task_only_epochs: 300
    cost_warmup_epochs: 0
  regularization:
    kl_to_pretrained: false
    kl_coef: 0.05
  guard:
    enable: true
    eval_every: 10
    success_tolerance: 0.03
    rollback_on_drop: true

ppo:
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.05
  max_grad_norm: 0.5
  efficiency_coef: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 8
  batch_size: 64

optimizer:
  lr: 3.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  num_epochs: 300
  n_rollouts_per_epoch: 6
  eval_every: 10
  checkpoint_every: 50
  tqdm_interval_sec: 1.0

logging:
  project: ada_bridger_lift
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False


multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
